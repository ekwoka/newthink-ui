name: Perform Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10.33.2
          run_install: false

      - name: Install Dependencies
        shell: bash
        run: pnpm i

      - name: Build Package
        run: pnpm run build
